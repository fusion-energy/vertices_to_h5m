
# This CI will launch a Docker image that contains all the dependencies required
# within that image the pytest test suite is run 


name: CI with install

on:
  pull_request:    
    branches:
    - develop
    - main
 
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://shimwell.github.io/wheels openmc
          python -m pip install .
          python -c "import vertices_to_h5m"

      - name: install package with tests
        run: |
          pip install .[tests]

      - name: Run test_utils
        run: |
          pytest tests -v 
