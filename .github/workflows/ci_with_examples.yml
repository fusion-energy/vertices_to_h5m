
# This CI will launch a Docker image that contains all the dependencies required
# within that image the pytest test suite is run 


name: CI with examples

on:
  pull_request:    
    branches:
    - develop
    - main
 
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      
      - name: install cadquery as needed by the examples
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libosmesa6 libosmesa6-dev libgles2-mesa-dev
          python -m pip install cadquery
          python -m pip install --extra-index-url https://shimwell.github.io/wheels moab

      - name: Run examples
        run: |
          cd examples
          python one_volume_cadquery_tesselation.py
          python one_volume_mesh.py
          python two_volume_mesh.py
